services:
  - type: web
    name: secure-internship-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
